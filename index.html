<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trend Picker — Instagram Reels</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Latest Trends</h1>
    <p>Click "Shortlist" on any reel you like, then export your picks at the bottom.</p>
  </header>

  <main id="grid"></main>

  <footer>
    <button id="export-btn">Export Shortlist</button>
    <div id="shortlist-output"></div>
  </footer>

  <script src="https://www.instagram.com/embed.js" async></script>
  <script src="links.js"></script>
  <script src="app.js"></script>
</body>
</html>
